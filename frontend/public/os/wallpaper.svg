<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="60%" cy="48%" r="75%">
      <stop offset="0%" stop-color="#20242e"/>
      <stop offset="55%" stop-color="#12141a"/>
      <stop offset="100%" stop-color="#020203"/>
    </radialGradient>
    <radialGradient id="glow" cx="52%" cy="50%" r="30%">
      <stop offset="0%" stop-color="#367bf0" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#367bf0" stop-opacity="0"/>
    </radialGradient>
    <filter id="bokeh" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>

  <!-- bokeh light orbs -->
  <circle cx="460" cy="100" r="34" fill="#7d8aa0" opacity="0.16" filter="url(#bokeh)"/>
  <circle cx="610" cy="235" r="52" fill="#8b97ab" opacity="0.14" filter="url(#bokeh)"/>
  <circle cx="1690" cy="860" r="100" fill="#7d8aa0" opacity="0.16" filter="url(#bokeh)"/>
</svg>
