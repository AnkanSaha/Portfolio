<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="60%" cy="48%" r="75%">
      <stop offset="0%" stop-color="#20242e"/>
      <stop offset="55%" stop-color="#12141a"/>
      <stop offset="100%" stop-color="#020203"/>
    </radialGradient>
    <radialGradient id="glow" cx="52%" cy="50%" r="30%">
      <stop offset="0%" stop-color="#367bf0" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#367bf0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dragonBodyWp" x1="8%" y1="95%" x2="95%" y2="0%">
      <stop offset="0%" stop-color="#7c8798"/>
      <stop offset="55%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="bokeh" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <g id="dragonMark">
      <g stroke="url(#dragonBodyWp)" fill="none" stroke-linecap="round">
        <path d="M 40,32 C 54,20 66,12 82,6" stroke-width="3"/>
        <path d="M 38,36 C 52,26 68,20 88,16" stroke-width="3.6"/>
        <path d="M 36,41 C 50,33 66,29 86,27" stroke-width="4.2"/>
      </g>
      <path d="M 34,36 C 50,30 68,34 80,50 C 92,66 92,88 78,102 C 68,112 54,116 44,111"
            stroke="url(#dragonBodyWp)" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 44,111 C 40,110 37,107 36,103 L 41,104 C 42,107 43,109 46,110 Z" fill="url(#dragonBodyWp)"/>
      <path d="M 34,36 C 30,32 24,30 16,31 C 8,32 2,37 0,44 C 6,40 12,38 18,39 C 14,44 8,47 2,47 C 9,52 18,51 24,45 C 27,42 30,39 34,36 Z" fill="url(#dragonBodyWp)"/>
      <circle cx="20" cy="37" r="2" fill="#0a0b0e"/>
    </g>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>

  <!-- bokeh light orbs -->
  <circle cx="460" cy="100" r="34" fill="#7d8aa0" opacity="0.16" filter="url(#bokeh)"/>
  <circle cx="610" cy="235" r="52" fill="#8b97ab" opacity="0.14" filter="url(#bokeh)"/>
  <circle cx="1690" cy="860" r="100" fill="#7d8aa0" opacity="0.16" filter="url(#bokeh)"/>

  <!-- wireframe globe (original homage, not traced) -->
  <g stroke="#aeb8c8" stroke-width="1.3" fill="none" opacity="0.16">
    <circle cx="960" cy="540" r="260"/>
    <ellipse cx="960" cy="540" rx="240" ry="260"/>
    <ellipse cx="960" cy="540" rx="184" ry="260"/>
    <ellipse cx="960" cy="540" rx="99" ry="260"/>
    <line x1="960" y1="280" x2="960" y2="800"/>
    <ellipse cx="960" cy="360" rx="260" ry="45"/>
    <ellipse cx="960" cy="440" rx="260" ry="62"/>
    <ellipse cx="960" cy="540" rx="260" ry="69"/>
    <ellipse cx="960" cy="640" rx="260" ry="62"/>
    <ellipse cx="960" cy="720" rx="260" ry="45"/>
  </g>

  <use href="#dragonMark" transform="translate(480,260) scale(4.6)"/>

  <text x="1000" y="565" font-family="Cantarell, Arial, sans-serif" font-weight="700" font-size="108" letter-spacing="10" fill="#f4f6f9" filter="url(#softGlow)">ANKAN OS</text>
</svg>
